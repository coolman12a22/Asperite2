:root{
  --face:#3a3a3a;--face2:#464646;--face3:#555;--down:#2a2a2a;--sunk:#262626;--line:#1c1c1c;--hi:#4f4f4f;--text:#dcdcdc;--dim:#8d8d8d;
  --editor-bg:#2b2b2b;--accent:#f0aa32;--accent-text:#1a1a1a;--sel:#6a4f1e;--ok:#79c84a;
  --ui:"MGS1 HUD","Courier New",monospace;
}
*{box-sizing:border-box;-webkit-font-smoothing:none;font-smooth:never}
html,body{height:100%;margin:0;padding:0;background:var(--editor-bg);color:var(--text);overflow:hidden}
body{font:16px/1 var(--ui);user-select:none;-webkit-user-select:none;letter-spacing:0;text-rendering:optimizeSpeed}
#app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--face)}
button,input,select{font:inherit;color:inherit}
canvas{image-rendering:pixelated}
.ico{display:inline-block;width:16px;height:16px;background-size:16px 16px;background-repeat:no-repeat;image-rendering:pixelated;flex:none}
/* menubar */
#menubar{display:flex;height:22px;background:var(--face);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:50;align-items:stretch}
#menubar .mi{padding:0 8px;display:flex;align-items:center;cursor:default;white-space:nowrap}
#menubar .mi:hover,#menubar .mi.open{background:var(--accent);color:var(--accent-text)}
#menubar .sp{flex:1}
#menubar .brand{padding:0 10px;color:var(--dim);display:flex;align-items:center}
.menu{position:fixed;z-index:1000;background:var(--face);border:1px solid #111;box-shadow:2px 2px 0 rgba(0,0,0,.45);padding:2px;min-width:170px}
.menu .it{display:flex;align-items:center;gap:6px;height:20px;padding:0 6px 0 8px;white-space:nowrap;cursor:default}
.menu .it .k{margin-left:auto;padding-left:22px;color:var(--dim)}
.menu .it .ck{width:10px;color:var(--accent);flex:none}
.menu .it.hot,.menu .it:hover{background:var(--accent);color:var(--accent-text)}
.menu .it.hot .k,.menu .it:hover .k{color:#4a3510}
.menu .it.dis{color:#6b6b6b;pointer-events:none}
.menu .sep{height:1px;background:var(--line);margin:3px 2px;border-bottom:1px solid var(--hi)}
.menu .arr{margin-left:auto;padding-left:14px}
/* context bar */
#ctxbar{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px;background:var(--face);border-bottom:1px solid var(--line);flex:none;overflow:hidden;white-space:nowrap}
#ctxbar .grp{display:flex;align-items:center;gap:4px}
#ctxbar .lbl{color:var(--dim)}
#ctxbar .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:22px;min-width:22px;padding:0 6px;background:var(--face2);border:1px solid var(--line);box-shadow:inset 1px 1px 0 var(--hi);cursor:default;white-space:nowrap}
.btn:hover{background:var(--face3)}
.btn:active,.btn.on{background:var(--down);box-shadow:inset 1px 1px 0 #111}
.btn.on{color:var(--accent)}
.btn.sq{width:24px;padding:0}
.btn.dis{opacity:.45;pointer-events:none}
.btn.acc{background:var(--accent);color:var(--accent-text);box-shadow:inset 1px 1px 0 #ffd88a}
.btn.acc:active{background:#c88a20}
.inp{height:22px;background:var(--sunk);border:1px solid var(--line);box-shadow:inset 1px 1px 0 #151515;padding:0 4px;outline:none;min-width:0}
.inp:focus{border-color:var(--accent)}
input.inp[type=number]{width:46px}
select.inp{padding:0 2px}
.chk{display:inline-flex;align-items:center;gap:5px;cursor:default}
.chk i{width:12px;height:12px;background:var(--sunk);border:1px solid var(--line);display:inline-block;position:relative}
.chk.on i::after{content:"";position:absolute;inset:2px;background:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;height:14px;background:transparent;width:90px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--sunk);border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:14px;background:var(--face3);border:1px solid #111;margin-top:-6px}
input[type=range]::-moz-range-track{height:4px;background:var(--sunk);border:1px solid var(--line)}
input[type=range]::-moz-range-thumb{width:8px;height:14px;background:var(--face3);border:1px solid #111;border-radius:0}
/* main */
#main{flex:1;display:flex;min-height:0}
#colorbar{width:196px;flex:none;background:var(--face);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:6px;gap:6px;min-height:0}
#colorbar .fgbg{position:relative;height:50px;flex:none}
#colorbar .fgbg .box{position:absolute;width:34px;height:34px;border:1px solid #111;box-shadow:inset 0 0 0 1px #fff3,0 0 0 1px #0006;cursor:default}
#colorbar .fgbg .box canvas{width:100%;height:100%;display:block}
#colorbar .fgbg .fgb{left:4px;top:2px;z-index:2}
#colorbar .fgbg .bgb{left:26px;top:16px;z-index:1}
#colorbar .fgbg .swap{position:absolute;left:66px;top:4px}
#colorbar .fgbg .rst{position:absolute;left:66px;top:28px}
#colorbar .hexlbl{position:absolute;left:96px;top:6px;color:var(--dim);line-height:14px}
#palwrap{flex:1;min-height:60px;overflow:auto;background:var(--sunk);border:1px solid var(--line);padding:2px}
#palwrap canvas{display:block;cursor:default}
#colorbar .palbtns{display:flex;gap:4px;flex:none}
#toolbar{width:50px;flex:none;background:var(--face);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:4px 0;gap:2px;overflow-y:auto}
.tbtn{position:relative;width:34px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--face2);border:1px solid var(--line);box-shadow:inset 1px 1px 0 var(--hi);cursor:default}
.tbtn:hover{background:var(--face3)}
.tbtn.on{background:var(--accent);box-shadow:inset 1px 1px 0 #ffd88a}
.tbtn .tri{position:absolute;right:1px;bottom:1px;width:0;height:0;border-left:4px solid transparent;border-bottom:4px solid #bbb}
.tbtn.on .tri{border-bottom-color:#442}
#center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{display:flex;height:24px;background:var(--face);border-bottom:1px solid var(--line);flex:none;overflow:hidden;align-items:flex-end;gap:1px;padding:2px 4px 0}
.tab{display:flex;align-items:center;gap:6px;height:22px;padding:0 6px 0 8px;background:var(--face2);border:1px solid var(--line);border-bottom:none;cursor:default;white-space:nowrap;color:var(--dim);max-width:220px}
.tab.on{background:var(--editor-bg);color:var(--text);height:23px}
.tab .x{width:12px;height:12px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.tab .x:hover{background:var(--accent);color:var(--accent-text)}
.tab .mod{color:var(--accent)}
#edrow{flex:1;display:flex;min-height:0}
#edhost{flex:1;position:relative;min-width:0;min-height:0;background:var(--editor-bg);overflow:hidden}
.ed-canvas{position:absolute;left:0;top:0;outline:none}
#preview{width:172px;flex:none;background:var(--face);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:6px}
#preview .pv{flex:1;min-height:80px;background:var(--editor-bg);border:1px solid var(--line);position:relative}
#preview canvas{position:absolute;inset:0;width:100%;height:100%}
#preview .row{display:flex;gap:4px;align-items:center}
#statusbar{display:flex;align-items:center;gap:14px;height:24px;padding:0 8px;background:var(--face);border-top:1px solid var(--line);flex:none;color:var(--dim);white-space:nowrap;overflow:hidden}
#statusbar b{color:var(--text);font-weight:normal}
#statusbar .msg{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis}
#statusbar .inp{height:18px;width:52px;text-align:center}
/* timeline */
#timeline{height:196px;flex:none;border-top:1px solid var(--line);background:var(--face);display:flex;flex-direction:column;min-height:60px;position:relative}
#tlsplit{height:5px;cursor:ns-resize;background:var(--face);border-top:1px solid var(--line);flex:none}
#tlbar{display:flex;align-items:center;gap:4px;height:28px;padding:0 6px;border-bottom:1px solid var(--line);flex:none;overflow:hidden;white-space:nowrap}
#tlbar .vs{width:1px;height:18px;background:var(--line);margin:0 3px;box-shadow:1px 0 0 var(--hi)}
#tlbar .sp{flex:1}
#tlcv{flex:1;min-height:0;position:relative;background:var(--sunk)}
#tlcv canvas{position:absolute;left:0;top:0}
/* dialogs */
#overlay{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.dlg{background:var(--face);border:1px solid #111;box-shadow:4px 4px 0 rgba(0,0,0,.5);min-width:280px;max-width:94vw;max-height:94vh;display:flex;flex-direction:column}
.dlg .tt{height:22px;display:flex;align-items:center;padding:0 8px;background:var(--face2);border-bottom:1px solid var(--line);cursor:default}
.dlg .tt .x{margin-left:auto;cursor:default;color:var(--dim)}
.dlg .tt .x:hover{color:var(--accent)}
.dlg .bd{padding:10px;display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0}
.dlg .ft{display:flex;gap:6px;justify-content:flex-end;padding:8px 10px;border-top:1px solid var(--line)}
.dlg .fr{display:flex;align-items:center;gap:8px;min-height:22px}
.dlg .fr>label{width:92px;flex:none;color:var(--dim)}
.dlg .fr .inp{flex:0 1 auto}
.dlg .fr .grow{flex:1}
.dlg hr{border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--hi);margin:2px 0;width:100%}
.dlg .note{color:var(--dim);max-width:360px;line-height:1.35}
.dlg table{border-collapse:collapse}
.dlg td,.dlg th{padding:2px 8px 2px 0;text-align:left;font-weight:normal;white-space:nowrap}
.dlg .anchor{display:grid;grid-template-columns:repeat(3,22px);gap:2px}
.dlg .anchor .btn{width:22px;height:22px;padding:0}
.dlg .pvbox{background:var(--editor-bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.dlg .pvbox canvas{max-width:100%;max-height:100%}
.dlg .scroll{overflow:auto;max-height:50vh}
.dlg tr.row:hover{background:var(--face2)}
.kbd{padding:0 4px;background:var(--face2);border:1px solid var(--line);color:var(--text)}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:var(--down);border:1px solid var(--accent);padding:6px 12px;z-index:2000;pointer-events:none}
.popup{position:fixed;z-index:1100;background:var(--face);border:1px solid #111;box-shadow:3px 3px 0 rgba(0,0,0,.5);padding:8px;display:flex;flex-direction:column;gap:6px}
.popup .fr{display:flex;align-items:center;gap:6px}
.popup .fr label{width:18px;color:var(--dim)}
.popup .fr input[type=range]{flex:1;width:auto}
.popup .fr .inp{width:44px}
.cpick{display:flex;gap:6px}
.cpick canvas{cursor:crosshair;border:1px solid #111}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--sunk)}::-webkit-scrollbar-thumb{background:var(--face3);border:1px solid #111}
.dropzone{position:fixed;inset:0;z-index:3000;background:rgba(240,170,50,.15);border:3px dashed var(--accent);display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--accent)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
:root{color-scheme:dark}

</style>

    if(kind==='line'){if(e.shift){[bx,by]=snap15(ax,ay,bx,by);}if(e.ctrl){ax=2*x0-bx;ay=2*y0-by;}st.line(ax,ay,bx,by,br);}
    else{if(e.shift){const s=Math.max(Math.abs(bx-ax),Math.abs(by-ay));bx=ax+(bx>=ax?s:-s);by=ay+(by>=ay?s:-s);}
      if(e.ctrl){ax=2*x0-bx;ay=2*y0-by;}
      if(kind==='rect')drawRect(st,br,ax,ay,bx,by,filled);else drawEllipse(st,br,ax,ay,bx,by,filled);}
    ed_inv();};
  const ed_inv=()=>inv(st);

    down(e,ed){App.commitFloat();t=getTarget();if(!t)return false;btn=e.button;st=new Stroke(App.doc,t.cel,t.layer,strokeOpts(btn));x0=e.x;y0=e.y;cur=e;draw(e);return true;},

    redraw(){if(st&&cur)draw(cur);},
    onkey(ev){if((ev.key==='Shift'||ev.key==='Control')&&st&&cur){cur={...cur,shift:ev.shiftKey,ctrl:ev.ctrlKey};draw(cur);}return false;}};}

  ctxMenu(e){const d=App.doc;if(!d)return;const [x,y]=this.pos(e);const hit=this.hit(x,y);if(!hit)return;const X=e.clientX,Yy=e.clientY;
    const C=id=>({label:()=>{const c=COMMANDS[id];return typeof c.name==='function'?c.name():c.name;},key:COMMANDS[id].key?fmtKey(COMMANDS[id].key):'',dis:()=>COMMANDS[id].enabled?!COMMANDS[id].enabled():false,fn:()=>runCommand(id)});

  /* ---- drawing ---- */
  draw(){const d=App.doc;const ctx=this.ctx,dpr=this.dpr,W=this.W,H=this.H;if(!W)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;
    const cs=getComputedStyle(document.documentElement);const col=n=>cs.getPropertyValue(n).trim();

    if(!d){return;}
    this.clampScroll();const CW=this.CW,CH=TL.CH,LW=TL.LW,hh=this.headH(),rows=this.rows();const nF=d.frames.length;

          const emptyCel=false;}
        else if(L.kind==='image'){ctx.fillStyle='#555';ctx.fillRect(x+CW/2-2,y+CH/2-2,2,2);}

      const idxOf=id=>rows.findIndex(rw=>rw.layer.id===id);for(const c of d.celSel){const ri=idxOf(c.l)+dRow,f=c.f+dF;ctx.strokeRect(LW+f*CW-this.sx+0.5,hh+ri*CH-this.sy+0.5,CW-2,CH-2);}ctx.setLineDash([]);}
    ctx.restore();
    // layer column
    ctx.save();ctx.beginPath();ctx.rect(0,hh,LW,H-hh);ctx.clip();
    for(let r=r0;r<=r1;r++){const y=hh+r*CH-this.sy;const row=rows[r],L=row.layer;const active=L.id===d.layerId;
      ctx.fillStyle=active?'#6a5522':(r%2?'#3a3a3a':'#404040');ctx.fillRect(0,y,LW,CH-1);
      ctx.drawImage(ICON_CV[L.visible?'eye':'eye_off'],2,y+1);ctx.drawImage(ICON_CV[L.editable?'unlock':'lock'],18,y+1);
      const ind=row.depth*10;let tx=38+ind;if(L.kind==='group'){ctx.drawImage(ICON_CV[L.collapsed?'arrow_r':'arrow_d'],34+ind,y+1);tx=50+ind;}
      ctx.fillStyle=active?'#fff':(L.visible&&d.isLayerVisible(L)?text:'#777');let nm=L.name+(L.background?' (bg)':'');
      while(nm.length>1&&ctx.measureText(nm).width>LW-tx-3)nm=nm.slice(0,-2)+'…';

    if(this.layerDrag&&this.layerDrag.active){ctx.strokeStyle=acc;ctx.beginPath();const yy=this.layerDrag.y;ctx.moveTo(0,yy);ctx.lineTo(LW,yy);ctx.stroke();}

    ctx.fillStyle=face;ctx.fillRect(0,0,W,hh);ctx.fillStyle=line;ctx.fillRect(0,hh-1,W,1);ctx.fillRect(LW-1,0,1,H);
    ctx.save();ctx.beginPath();ctx.rect(LW,0,W-LW,hh);ctx.clip();
    // tags
    for(const t of d.tags){const x=LW+t.from*CW-this.sx,w=(t.to-t.from+1)*CW-1;ctx.fillStyle=colorCss((t.color||rgba(120,120,255))|0xff000000);ctx.fillRect(x,1,w,TL.TAGH-2);
      if(App.selTag===t){ctx.strokeStyle='#fff';ctx.strokeRect(x+0.5,1.5,w-1,TL.TAGH-3);}
      ctx.fillStyle='#111';ctx.fillText(t.name,x+3,TL.TAGH-3);}
    for(let f=f0;f<=f1;f++){const x=LW+f*CW-this.sx;const cur=f===d.frame;const inSel=d.frameRange&&f>=d.frameRange[0]&&f<=d.frameRange[1]&&d.celSel.length;
      ctx.fillStyle=cur?acc:(inSel?'#6a5522':face2);ctx.fillRect(x,TL.TAGH,CW-1,TL.RH-1);
      ctx.fillStyle=cur?'#1a1a1a':text;const s=String(f+1);ctx.textAlign='center';ctx.fillText(s,x+CW/2,TL.TAGH+TL.RH-4);ctx.textAlign='left';}
    ctx.restore();
    // corner info
    ctx.fillStyle=dim;ctx.fillText(d.frames[d.frame].dur+' ms',4,hh-6);
    ctx.fillStyle=line;ctx.fillRect(0,0,1,H);}
}

/* ---- keymap ---- */
const KEYMAP_KEY='aseweb.keys.v1';let userKeys={};
try{userKeys=JSON.parse(localStorage.getItem(KEYMAP_KEY)||'{}');}catch(e){}
function normKey(k){if(!k)return '';const parts=k.split('+');const key=parts.pop()||'+';const mods=new Set(parts);return ['Ctrl','Alt','Shift'].filter(m=>mods.has(m)).concat(key.length===1?key.toUpperCase():key).join('+');}
function evKey(e){let k=e.key;if(k==='Control'||k==='Shift'||k==='Alt'||k==='Meta')return null;
  const map={' ':'Space',Esc:'Escape',ArrowLeft:'Left',ArrowRight:'Right',ArrowUp:'Up',ArrowDown:'Down'};k=map[k]||k;
  const shift=e.shiftKey;if(k.length===1){if(k==='='&&!shift){k='=';}k=k.toUpperCase();
    // shifted symbol keys: use code to determine base key for shifted combos
    if(shift&&!/[A-Z0-9]/.test(k)){const c=e.code;if(c==='Quote')k="'";else if(c==='Equal')k='+';else if(c==='Minus')k='-';else if(c==='BracketLeft')k='[';else if(c==='BracketRight')k=']';else if(c==='Comma')k=',';else if(c==='Period')k='.';}}
  return (e.ctrlKey||e.metaKey?'Ctrl+':'')+(e.altKey?'Alt+':'')+(shift&&!(k==='+'&&e.key==='+')?'Shift+':'')+k;}
let KEYS={};
function rebuildKeymap(){KEYS={};
  for(const id in COMMANDS){const c=COMMANDS[id];const k=userKeys[id]!==undefined?userKeys[id]:c.key;if(k)for(const kk of String(k).split('|'))KEYS[normKey(kk)]=id;}
  const tk={};for(const id in TOOLS){const T=TOOLS[id];if(!T.key)continue;const k=userKeys['tool_'+id]!==undefined?userKeys['tool_'+id]:T.key;if(k){const n=normKey(k);(tk[n]=tk[n]||[]).push(id);}}
  KEYS.__tools=tk;KEYS[normKey('=')]=KEYS[normKey('=')]||'zoom_in';KEYS[normKey('+')]=KEYS[normKey('+')]||'zoom_in';KEYS[normKey('Shift+Ctrl+Z')]=KEYS[normKey('Shift+Ctrl+Z')]||'redo';KEYS[normKey('Ctrl+=')]='zoom_in';KEYS[normKey('Ctrl+-')]='zoom_out';}
function keyFor(id){return userKeys[id]!==undefined?userKeys[id]:(COMMANDS[id]?COMMANDS[id].key:'');}
function setUserKey(id,k){userKeys[id]=k;try{localStorage.setItem(KEYMAP_KEY,JSON.stringify(userKeys));}catch(e){}rebuildKeymap();}
const typing=t=>t&&(t.tagName==='INPUT'&&!['checkbox','range','button'].includes(t.type)||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
function onKeyDown(e){
  if(e.key==='Alt')e.preventDefault();
  if(dialogStack.length)return;if(typing(e.target))return;
  const ed=App.editor;
  if(e.key==='Alt'&&ed){ed.altDown=true;ed.requestDraw();}
  if(e.key===' '){e.preventDefault();if(!e.repeat&&!App.tempTool&&!(ed&&ed.pressed)){App.tempTool='hand';ed.updateCursor();}return;}
  const T=TOOLS[App.tool];
  if(T&&T.onkey&&T.onkey(e)){e.preventDefault();return;}
  const combo=evKey(e);if(!combo)return;
  const base=combo.split('+').pop();
  if(['Left','Right','Up','Down'].includes(base)&&App.doc){const n=e.shiftKey?10:1;const dx=base==='Left'?-n:base==='Right'?n:0,dy=base==='Up'?-n:base==='Down'?n:0;
    if(!e.ctrlKey&&!e.altKey&&(App.tool==='move'||App.doc.sel||App.doc.floating)){e.preventDefault();
      if(App.doc.floating){const f=App.doc.floating;f.x+=dx;f.y+=dy;if(App.doc.sel)App.doc.sel=App.doc.sel.translate(dx,dy);ed.requestDraw();}else App.moveContent(dx,dy,false);return;}
    if(!e.ctrlKey&&!e.altKey){e.preventDefault();App.doc.ox-=dx*16;App.doc.oy-=dy*16;ed.clampView();ed.requestDraw();return;}}
  if(App.doc&&App.doc.floating&&combo==='Enter'){e.preventDefault();App.commitFloat();return;}
  if(combo==='Escape'&&App.doc&&App.doc.sel){e.preventDefault();App.doc.setSelection(null,'Deselect');return;}
  const id=KEYS[combo];
  if(id){e.preventDefault();runCommand(id);return;}
  const ts=KEYS.__tools[combo];
  if(ts){e.preventDefault();let pick=ts[0];const i=ts.indexOf(App.tool);if(i>=0)pick=ts[(i+1)%ts.length];else{const g=TOOLS[ts[0]].group;if(g&&ts.includes(App.groupTool[g]))pick=App.groupTool[g];}
    App.setTool(pick);if(TOOLS[pick].group)App.groupTool[TOOLS[pick].group]=pick;buildToolbar();}
}
function onKeyUp(e){const ed=App.editor;if(e.key===' '){if(App.tempTool==='hand'){App.tempTool=null;ed.updateCursor();}}
  if(e.key==='Alt'){e.preventDefault();ed.altDown=false;ed.requestDraw();}
  const T=TOOLS[App.tool];if(T&&T.onkey&&(e.key==='Shift'||e.key==='Control'))T.onkey(e);}

function pickFiles(accept,multiple){return new Promise(res=>{const i=h('input',{type:'file',accept,multiple:!!multiple,style:{display:'none'}});document.body.appendChild(i);

const extOf=n=>(n.split('.').pop()||'').toLowerCase();
const b64u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
function docFromImage(r,name){let d;
  if(r.indices&&r.palette&&r.palette.some(c=>pA(c)===0)&&r.palette.length<=256){d=new Doc(r.w,r.h,'indexed');d.palette=r.palette.slice();d.transparentIndex=r.palette.findIndex(c=>pA(c)===0);
    const l=new Layer('Layer 1');l.parent=d.root;d.root.children.push(l);const img=new Img(r.w,r.h);for(let i=0;i<img.data.length;i++)img.data[i]=r.indices[i];l.cels=[{img,opacity:255,x:0,y:0}];d.layerId=l.id;}
  else{d=new Doc(r.w,r.h,'rgb');const l=new Layer('Layer 1');l.parent=d.root;d.root.children.push(l);l.cels=[{img:new Img(r.w,r.h,r.data),opacity:255,x:0,y:0}];d.layerId=l.id;
    if(r.palette&&r.palette.length<=256)d.palette=r.palette.slice();}
  d.name=name;d.fileName=null;d.hist=[];d.hi=0;d.savedAt=0;return d;}
function docFromFrames(frames,name){const W=Math.max(...frames.map(f=>f.w)),H=Math.max(...frames.map(f=>f.h));const d=new Doc(W,H,'rgb');const l=new Layer('Layer 1');l.parent=d.root;d.root.children.push(l);
  d.frames=frames.map(f=>({dur:f.dur||100}));l.cels=frames.map(f=>{const img=new Img(W,H);for(let y=0;y<f.h;y++)for(let x=0;x<f.w;x++)img.data[y*W+x]=f.data[y*f.w+x];return {img,opacity:255,x:0,y:0};});d.layerId=l.id;d.name=name;d.hist=[];d.hi=0;d.savedAt=0;return d;}
async function openFiles(files){const imgs=[];let opened=0;
  const handle=async(name,u8,file)=>{const ext=extOf(name);
    if(ext==='aseprite'||ext==='ase'){const d=await readAseprite(u8);d.name=name;d.fileName=name;addDoc(d);opened++;}
    else if(ext==='gif'){const g=gifDecode(u8);const d=docFromFrames(g.frames.map(f=>({w:g.w,h:g.h,data:f.data,dur:f.dur})),name);addDoc(d);opened++;}
    else if(['png','jpg','jpeg','webp','bmp'].includes(ext)){const r=await decodeImageAny(u8,ext==='jpg'?'image/jpeg':'image/'+ext);imgs.push({name,r});}
    else if(ext==='zip'){const fs=await zipRead(u8);for(const f of fs)await handle(f.name.split('/').pop(),f.data);}
    else if(['gpl','pal','hex','txt'].includes(ext)){if(!App.doc){App.toast('Open a sprite first to load a palette');return;}const cols=parsePalette(new TextDecoder().decode(u8),name);if(cols.length){setPalette(cols,'Load Palette');opened++;}}
    else App.toast('Unsupported file: '+name);};
  for(const f of files){try{await handle(f.name,new Uint8Array(await f.arrayBuffer()),f);}catch(e){console.error(e);alertBox('Could not open "'+f.name+'": '+(e.message||e),'Error');}}
  if(imgs.length===1)addDoc(docFromImage(imgs[0].r,imgs[0].name));
  else if(imgs.length>1){const asAnim=await confirmBox('Open '+imgs.length+' images as frames of one animation?','Open Images','As animation','Separately');
    if(asAnim)addDoc(docFromFrames(imgs.map(i=>({w:i.r.w,h:i.r.h,data:i.r.data,dur:100})),imgs[0].name.replace(/\.[^.]+$/,'')+' (anim)'));else imgs.forEach(i=>addDoc(docFromImage(i.r,i.name)));}
  return opened+imgs.length;}

async function loadPaletteFile(f){const ext=extOf(f.name);const u8=new Uint8Array(await f.arrayBuffer());let cols=[];
  if(ext==='png'){const r=await decodeImageAny(u8,'image/png');if(r.palette&&r.indices)cols=r.palette.slice();else{const seen=new Set();for(const c of r.data){if(pA(c)&&!seen.has(c)){seen.add(c);cols.push(c);if(cols.length>=256)break;}}}}
  else if(ext==='aseprite'||ext==='ase'){cols=(await readAseprite(u8)).palette;}else cols=parsePalette(new TextDecoder().decode(u8),f.name);
  if(!cols.length){App.toast('No colors found in '+f.name);return;}setPalette(cols,'Load Palette');App.say('Loaded '+cols.length+' colors');}

async function saveDoc(d,asNew){let name=d.fileName;
  if(asNew||!name){const dl=await getDownloads();const nm=h('input',{class:'inp grow',value:docBaseName(d)});
    const fmt=selField('Format',[['aseprite','Aseprite (.aseprite)'],['png','PNG image (.png)'],['gif','Animated GIF (.gif)']],'aseprite');
    const note=h('div',{class:'note'},dl?'Note: this viewer only saves a fixed set of file types, so .aseprite projects are delivered inside a .zip file. File > Open reads that zip directly.':'The file will be downloaded by your browser.');
    const r=await dialog('Save As',h('div',null,field('File name',nm),fmt.el,note),OKCANCEL(()=>{}),{});if(r!=='OK')return false;
    const base=(nm.value||'sprite').replace(/\.[^.]+$/,'');

    name=base+'.aseprite';}
  const bytes=await writeAseprite(d);const saved=await saveFile(name,bytes,'application/octet-stream');
  if(saved){d.fileName=name;d.name=name;d.markSaved();App.emit('docs');App.say('Saved '+saved);return true;}return false;}

function frameRangeX(doc,o){if(o.frames==='current')return [doc.frame];return frameRange(doc,o);}
async function exportWith(d,o){const o2={...o};const frs=frameRangeX(d,o);const all=exportFrames(d,{...o,frames:'all'});const sel=all.filter(f=>frs.includes(f.frame));
  if(!sel.length){App.toast('No frames to export');return;}
  const base=o.filename||docBaseName(d);const ext=o.format;
  const toBytes=async(img)=>{if(ext==='png')return encodePNG(img.w,img.h,img.data);
    const cv=document.createElement('canvas');cv.width=img.w;cv.height=img.h;const x=cv.getContext('2d');if(ext==='jpg'){x.fillStyle='#fff';x.fillRect(0,0,img.w,img.h);const t=document.createElement('canvas');t.width=img.w;t.height=img.h;t.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(img.data.slice().buffer),img.w,img.h),0,0);x.drawImage(t,0,0);}
    else x.putImageData(new ImageData(new Uint8ClampedArray(img.data.slice().buffer),img.w,img.h),0,0);
    const blob=await new Promise(r=>cv.toBlob(r,ext==='jpg'?'image/jpeg':'image/webp',0.95));return new Uint8Array(await blob.arrayBuffer());};
  if(ext==='gif'){const gb=gifEncode(sel.map(f=>f.img.data),sel.map(f=>d.frames[f.frame].dur),sel[0].img.w,sel[0].img.h,{loop:o.loop===false?-1:0,forcePalette:d.mode==='indexed',palette:d.mode==='indexed'?d.palette.filter((c,i)=>pA(c)>0||i>0):null});
    await saveFile(base+'.gif',gb,'image/gif');return;}
  if(sel.length===1){await saveFile(base+'.'+ext,await toBytes(sel[0].img),'image/'+(ext==='jpg'?'jpeg':ext));return;}
  const files=[];for(const f of sel)files.push({name:`${base}${f.frame}.${ext}`,data:await toBytes(f.img)});
  await saveFile(base+'.zip',zipStore(files),'application/zip');}
async function exportAsDialog(){const d=App.doc;const fmt=selField('Format',[['png','PNG'],['gif','Animated GIF'],['jpg','JPEG'],['webp','WebP']],'png');

  const layers=selField('Layers',[['visible','Visible layers'],['all','All layers'],['selected','Selected layer']],'visible');

const IDBX={db:null,

  put(k,v){return this.tx('readwrite',s=>s.put(v,k));},del(k){return this.tx('readwrite',s=>s.delete(k));},
  all(){return this.open().then(db=>new Promise((res,rej)=>{const out=[];const t=db.transaction('docs','readonly');const c=t.objectStore('docs').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push({k:cur.key,v:cur.value});cur.continue();}else res(out);};c.onerror=()=>rej(c.error);}));}};

  for(const e of all)await IDBX.del(e.k);return ok;}catch(e){return false;}}

addDoc=function(d){d.uid=d.uid||(Date.now()+'_'+(uidN++));
  let lastMod=d.modified;d.on('change',k=>{if(k==='pixels'||k==='struct'||k==='hist'||k==='sel'||k==='frame'||k==='layers'||k==='saved'){queueUI(d,k);if(k!=='frame'&&k!=='sel'&&k!=='layers')scheduleAutosave(d);}});
  return _addDoc(d);};
let uiQ=false;function queueUI(d,k){if(uiQ)return;uiQ=true;requestAnimationFrame(()=>{uiQ=false;if(d!==App.doc)return;updateStatus();
  const m=d.modified;if(d._lastMod!==m){d._lastMod=m;buildTabs();}
  if(k==='hist'||k==='struct'){updateColorbar();}if(App.timeline)App.timeline.request();});}
App.on('doc',d=>{if(d){updateStatus();updateColorbar();buildCtx();}if(App.timeline){App.timeline.hook();App.timeline.request();}});
const _closeDoc=App.closeDoc.bind(App);App.closeDoc=function(d){_closeDoc(d);try{IDBX.del('doc:'+d.uid);}catch(e){}};
/* ===================== boot ===================== */
function buildLayout(){document.getElementById('app').innerHTML='';const A=$('#app');
  A.append(h('div',{id:'menubar'}),h('div',{id:'ctxbar'}),
    h('div',{id:'main'},h('div',{id:'colorbar'}),h('div',{id:'toolbar'}),
      h('div',{id:'center'},h('div',{id:'tabs'}),h('div',{id:'edrow'},h('div',{id:'edhost'}),h('div',{id:'preview'})),h('div',{id:'tlsplit'}),h('div',{id:'timeline'},h('div',{id:'tlbar'}),h('div',{id:'tlcv'})))),
    h('div',{id:'statusbar'}));}
async function boot(){
  loadSettings();
  try{await Promise.all([document.fonts.load('16px "MGS1 HUD"'),document.fonts.load('16px "MGS1 Codec"')]);}catch(e){}
  buildLayout();buildMenubar();buildToolbar();buildColorbar();buildStatus();buildPreview();buildTimelineBar();
  App.editor=new Editor($('#edhost'));App.timeline=new Timeline($('#tlcv'));
  rebuildKeymap();buildCtx();buildTabs();
  $('#preview').style.display=App.opt.showPreview?'':'none';
  // splitter
  const sp=$('#tlsplit');sp.addEventListener('pointerdown',e=>{sp.setPointerCapture(e.pointerId);const startY=e.clientY,h0=$('#timeline').offsetHeight;
    sp.onpointermove=ev=>{$('#timeline').style.height=clamp(h0-(ev.clientY-startY),70,Math.max(120,innerHeight-260))+'px';};sp.onpointerup=()=>{sp.onpointermove=null;};});
  document.addEventListener('keydown',onKeyDown);document.addEventListener('keyup',onKeyUp);
  window.addEventListener('blur',()=>{App.tempTool=null;if(App.editor){App.editor.altDown=false;App.editor.updateCursor();}});
  // paste event
  let pasteT=null;
  document.addEventListener('keydown',e=>{if(dialogStack.length||typing(e.target))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'&&!e.shiftKey){clearTimeout(pasteT);pasteT=setTimeout(()=>runCommand('paste'),120);}},true);
  document.addEventListener('paste',async e=>{if(typing(e.target)||dialogStack.length)return;clearTimeout(pasteT);const items=[...(e.clipboardData?e.clipboardData.items:[])];const it=items.find(i=>i.type.startsWith('image/'));
    e.preventDefault();if(it){const f=it.getAsFile();const r=await decodeImageAny(new Uint8Array(await f.arrayBuffer()),f.type);if(!App.doc)addDoc(docFromImage(r,'Pasted.png'));else App.pasteImage(new Img(r.w,r.h,r.data));}else runCommand('paste');});
  // drag & drop
  let dz=null;const showDz=()=>{if(!dz){dz=h('div',{class:'dropzone'},'Drop files to open (.aseprite, .png, .gif, .zip, palettes)');document.body.appendChild(dz);}};const hideDz=()=>{if(dz){dz.remove();dz=null;}};
  window.addEventListener('dragover',e=>{e.preventDefault();showDz();});window.addEventListener('dragleave',e=>{if(!e.relatedTarget)hideDz();});
  window.addEventListener('drop',e=>{e.preventDefault();hideDz();if(e.dataTransfer.files.length)openFiles(e.dataTransfer.files);});
  window.addEventListener('beforeunload',e=>{if(App.docs.some(d=>d.modified)){e.preventDefault();e.returnValue='';}});
  App.on('doc',()=>{$('#colorbar').style.display=App.opt.showColorBar?'':'none';});
  // startup content
  const restored=await restoreSession();
  if(!App.docs.length){try{await openSample('inputs');App.say('Sample sprite loaded. Use File > New (Ctrl+N) to start a blank sprite.',8000);}catch(e){console.error(e);addDoc(newDocument(64,64,'rgb','transparent'));}}
  App.setTool('pencil',true);App.emit('tool','pencil');buildToolbar();
  if(App.editor.doc&&App.editor.doc.pendingFit)setTimeout(()=>App.editor.fit(),30);
  setTimeout(()=>{App.editor.resize();App.timeline.resize();updateColorbar();},60);
  window.__app=App;
}
boot();
